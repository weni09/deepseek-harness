# Build DeepSeek Harness desktop packages (Linux .deb/.AppImage and macOS Intel DMG/ZIP)
# from the official source at an official release tag.
#
# The scheduled run resolves the newest official `dsh-v*` tag, checks the source
# tree out at that exact tag, applies the patches kept in `patches/`, builds the
# packages on Linux and macOS Intel runners, and publishes them as a GitHub Release
# under the same tag name. The packaged version therefore always equals the official
# version, because it is read from the tag's own `package.json`.
#
# A tag that already has a release is skipped, so the schedule is idempotent and
# a manual dispatch can rebuild one tag with `force`.
name: Desktop package

on:
  push:
    # A patch or workflow change re-evaluates the newest eligible tag right away; a tag that
    # already has a release is skipped, so documentation-only pushes stay on `paths`.
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/desktop.yml'
  schedule:
    # 03:17 Asia/Shanghai every day; the offset keeps the run out of the top-of-hour rush.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Official dsh-v* tag to build (stable or release candidate); empty builds the newest eligible one'
        required: false
        type: string
      force:
        description: 'Rebuild even when a release for that tag already exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-package
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness

jobs:
  resolve:
    name: Resolve official tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      exists: ${{ steps.resolve.outputs.exists }}
    steps:
      - name: Resolve the tag to build
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Alpha and canary builds are internal channels, the same two the release scripts give
          # their own npm dist-tags; this pipeline only ever packages release-candidate and stable tags.
          excluded_channels='(alpha|canary)'

          # Newest tag by base version, preferring the stable release of that base over its
          # prereleases: the sort key is <base version, stable rank, full tag>.
          resolve_newest() {
            git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^dsh-v[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -vE "^dsh-v[0-9]+\.[0-9]+\.[0-9]+-${excluded_channels}(\.|$)" \
              | while read -r candidate; do
                  body=${candidate#dsh-v}
                  base=${body%%-*}
                  if [ "$base" = "$body" ]; then rank=1; else rank=0; fi
                  printf '%s\t%s\t%s\n' "$base" "$rank" "$candidate"
                done \
              | sort -k1,1V -k2,2n -k3,3V \
              | tail -n 1 | cut -f3 || true
          }

          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            if printf '%s' "$tag" | grep -qE "^dsh-v[0-9]+\.[0-9]+\.[0-9]+-${excluded_channels}(\.|$)"; then
              echo "::error::${tag} is an alpha or canary build; this pipeline packages release candidates and stable releases only"
              exit 1
            fi
          else
            tag=$(resolve_newest)
          fi

          if [ -z "$tag" ]; then
            echo "::error::No stable or release-candidate dsh-v* tag found in ${UPSTREAM_REPOSITORY}"
            exit 1
          fi
          echo "Resolved tag: $tag"
          if [ "${FORCE:-false}" = 'true' ]; then
            exists=false
          elif [ "${GITHUB_EVENT_NAME:-}" = 'push' ]; then
            # A push to main indicates updated patches or workflows, rebuild to refresh release assets
            exists=false
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exists=true
          else
            exists=false
          fi
          echo "Release already published: $exists"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

  package-linux:
    name: Build Linux .deb and .AppImage
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_DIR: ${{ github.workspace }}/source
    steps:
      - name: Check out the packaging repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Check out official source at the tag
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify the packaged version matches the official tag
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          version=$(node -p "require('./package.json').version")
          if [ "dsh-v${version}" != "$TAG" ]; then
            echo "::error::Source version ${version} does not match tag ${TAG}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building DeepSeek Harness ${version} from ${TAG}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.SOURCE_DIR }}

      - name: Build the repository
        run: pnpm run build:official
        working-directory: ${{ env.SOURCE_DIR }}

      - name: Apply patches
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Applying $(basename "$patch")"
            git apply --verbose "$patch"
          done

      - name: Pack the release tarballs the desktop runtime installs
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          pnpm run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm run release:pack --family vendor --out dist/npm-vendor --concurrency 8
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Package the Linux desktop
        working-directory: ${{ env.SOURCE_DIR }}
        run: pnpm exec tsx scripts/package-linux-desktop.ts

      - name: Collect artifacts
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts-linux"
          cp dist/desktop/*.deb dist/desktop/*.AppImage "$GITHUB_WORKSPACE/artifacts-linux/"
          cd "$GITHUB_WORKSPACE/artifacts-linux"
          sha256sum ./* > SHA256SUMS-linux.txt
          ls -lh

      - name: Verify the built packages carry the official version
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          deb=$(ls dist/desktop/*.deb)
          deb_version=$(dpkg-deb --field "$deb" Version)
          expected=${VERSION//-/\~}
          echo "package.json: ${VERSION}  deb control: ${deb_version}"
          if [ "$deb_version" != "$expected" ]; then
            echo "::error::Built deb version ${deb_version} does not match the official ${VERSION}"
            exit 1
          fi
          echo "Included in the deb:"
          dpkg-deb --contents "$deb" | grep -F -e 'tray.png' -e '256x256/apps/deepseek-harness.png'

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-desktop-${{ needs.resolve.outputs.tag }}
          path: artifacts-linux/*
          if-no-files-found: error
          retention-days: 30

  package-mac-intel:
    name: Build macOS Intel DMG and ZIP
    needs: resolve
    if: needs.resolve.outputs.exists == 'false'
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_DIR: ${{ github.workspace }}/source
    steps:
      - name: Check out the packaging repository
        uses: actions/checkout@v4

      - name: Check out official source at the tag
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" "$SOURCE_DIR"
          cd "$SOURCE_DIR"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify the packaged version matches the official tag
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          version=$(node -p "require('./package.json').version")
          if [ "dsh-v${version}" != "$TAG" ]; then
            echo "::error::Source version ${version} does not match tag ${TAG}"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building DeepSeek Harness ${version} from ${TAG}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.SOURCE_DIR }}

      - name: Build the repository
        run: pnpm run build:official
        working-directory: ${{ env.SOURCE_DIR }}

      - name: Apply patches
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Applying $(basename "$patch")"
            git apply --verbose "$patch"
          done

      - name: Pack the release tarballs the desktop runtime installs
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          pnpm run release:pack --family dsh --out dist/npm --concurrency 8
          pnpm run release:pack --family vendor --out dist/npm-vendor --concurrency 8
          pnpm --dir native/system run build:ts
          pnpm --dir native/system/packages/entry pack --pack-destination "$PWD/dist/npm-landlock"

      - name: Package the macOS Intel desktop
        working-directory: ${{ env.SOURCE_DIR }}
        run: pnpm exec tsx scripts/package-mac-desktop.ts --arch x64

      - name: Collect artifacts
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts-mac"
          cp dist/desktop/*.dmg dist/desktop/*.zip "$GITHUB_WORKSPACE/artifacts-mac/"
          cd "$GITHUB_WORKSPACE/artifacts-mac"
          shasum -a 256 ./* > SHA256SUMS-mac.txt
          ls -lh

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-mac-intel-${{ needs.resolve.outputs.tag }}
          path: artifacts-mac/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Release
    needs: [resolve, package-linux, package-mac-intel]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-linux-desktop-${{ needs.resolve.outputs.tag }}
          path: all-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: deepseek-harness-mac-intel-${{ needs.resolve.outputs.tag }}
          path: all-artifacts

      - name: Generate unified SHA256SUMS
        working-directory: all-artifacts
        run: |
          set -euo pipefail
          rm -f SHA256SUMS*.txt
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        working-directory: all-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${TAG#dsh-v}
          notes=$(cat <<EOF
          Desktop packages for the official release ${TAG}.

          Built from ${UPSTREAM_REPOSITORY} with the patches in this repository.

          ### Linux (x86_64)
          - deepseek-harness_${version}_amd64.deb — installs to /opt/DeepSeek Harness and registers desktop entry.
          - deepseek-harness-${version}-x86_64.AppImage — single file, run with chmod +x first.

          ### macOS Intel (x64)
          - deepseek-harness-${version}-mac-x64.dmg — macOS installer disk image.
          - deepseek-harness-${version}-mac-x64.zip — portable application archive.

          The packaged versions strictly match the official version ${version}.
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading / overwriting assets..."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "DeepSeek Harness ${version} — Linux & macOS Intel desktop" \
              --notes "$notes" \
              ./*
          fi
